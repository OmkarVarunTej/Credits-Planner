<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)"/>
  
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="url(#radial-glow)"/>

  <!-- Border accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#border-gradient)" stroke-width="12" stroke-opacity="0.4"/>

  <!-- Main Symbol Group -->
  <g transform="translate(0, 12)">
    <!-- Graduation Cap Crown / Top Diamond Crest -->
    <path d="M256 100 L368 152 L256 204 L144 152 Z" fill="url(#crown-gradient)"/>
    <path d="M144 152 L144 180 C144 200 256 220 256 220 C256 220 368 200 368 180 L368 152" stroke="url(#crown-gradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="368" cy="180" r="10" fill="#A855F7"/>

    <!-- Geometric "V" Monogram -->
    <path d="M136 240 H204 L256 360 L308 240 H376 L284 430 H228 L136 240 Z" fill="#FFFFFF"/>
    
    <!-- Central Sparkle Accent -->
    <path d="M256 132 L262 152 L282 158 L262 164 L256 184 L250 164 L230 158 L250 152 Z" fill="#FFFFFF"/>
  </g>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <radialGradient id="radial-glow" cx="50%" cy="30%" r="60%">
      <stop stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="crown-gradient" x1="144" y1="100" x2="368" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>